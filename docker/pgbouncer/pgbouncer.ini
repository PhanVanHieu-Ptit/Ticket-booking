[databases]
ticket_booking = host=postgres port=5432 dbname=ticket_booking user=postgres

[pgbouncer]
listen_port = 6432
listen_addr = *
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 10000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
