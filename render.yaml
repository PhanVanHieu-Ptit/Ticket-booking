services:
  - name: ticket-booking-api
    type: web
    runtime: docker
    plan: free
    dockerfilePath: apps/backend/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 8080
      - key: APP_ENV
        value: production
      - key: GIN_MODE
        value: release
      # DB is Neon (external), not a Render-managed Postgres — set manually.
      # Use Neon's pooled connection string (hostname contains "-pooler"),
      # with sslmode=require.
      - key: DATABASE_URL
        sync: false
      # Use Neon's direct (unpooled) connection string — required for DDL/migrations.
      - key: DIRECT_DATABASE_URL
        sync: false
      # Redis is Upstash (external), not a Render Key Value instance — set manually.
      # Use Upstash's rediss:// (TLS) connection string.
      - key: REDIS_URL
        sync: false
      # Set manually in the Render dashboard after the first deploy.
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      # Set once the Vercel frontend URL is known, e.g.
      # https://ticket-booking.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
